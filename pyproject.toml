[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-sealing-robot"
version = "1.0.0"
description = "RGB-D crack perception, quantification, routing and pump-coordinated robotic repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.13", "scikit-image>=0.23", "opencv-python-headless>=4.8", "PyYAML>=6.0"]

[project.optional-dependencies]
hardware = ["pyrealsense2>=2.55", "pymodbus==3.6.9"]

[tool.setuptools]
py-modules = ["pipeline", "contracts"]

[tool.setuptools.packages.find]
include = ["perception*", "quantification*", "trajectory_planning*", "control*"]
namespaces = false

[tool.setuptools.package-data]
perception = ["best.pt"]
control = ["calibration/*"]
